<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#332c24">
  <title>Fichas - Grimório do Mestre</title>
  <link rel="manifest" href="../manifest.json">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="fichas.css">
</head>

<body>

  <div class="tela-fichas">

    <div class="fichas-moldura">

      <div class="moldura-canto moldura-canto--tl"></div>
      <div class="moldura-canto moldura-canto--tr"></div>
      <div class="moldura-canto moldura-canto--bl"></div>
      <div class="moldura-canto moldura-canto--br"></div>

      <header class="fichas-cabecalho">
        <div class="cabecalho-ornamento"></div>
        <h1 class="fichas-titulo">Fichas</h1>
        <p class="fichas-subtitulo">Herois, Criaturas e Destinos</p>
        <div class="cabecalho-ornamento"></div>
      </header>

      <div class="divider-golden fichas-divisor"></div>

      <nav class="fichas-grid" id="fichasGrid">

        <button class="fichas-botao" data-acao="jogar">
          <span class="botao-icone">&#9876;</span>
          <span class="botao-texto">Jogar</span>
          <span class="botao-descricao">Aventurar-se pelo Mundo</span>
        </button>

        <button class="fichas-botao" data-acao="criar">
          <span class="botao-icone">&#10016;</span>
          <span class="botao-texto">Criar Ficha</span>
          <span class="botao-descricao">Forjar um Novo Heroi</span>
        </button>

        <button class="fichas-botao" data-acao="editar">
          <span class="botao-icone">&#9998;</span>
          <span class="botao-texto">Editar Ficha</span>
          <span class="botao-descricao">Alterar Registros Existentes</span>
        </button>

      </nav>

      <div class="divider-golden fichas-divisor"></div>

      <!-- LISTA DE FICHAS (aparece ao clicar Editar ou Jogar) -->
      <div class="fichas-lista-area" id="fichasListaArea" style="display:none;">
        <div class="divider-golden fichas-divisor"></div>
        <h2 class="fichas-lista-titulo" id="fichasListaTitulo">Fichas Salvas</h2>

        <!-- Barra de selecao (somente modo Jogar) -->
        <div class="fichas-selecao-barra" id="fichasSelecaoBarra" style="display:none;">
          <span class="fichas-selecao-info" id="fichasSelecaoInfo">0 de 2 selecionadas</span>
          <button class="fichas-selecao-btn" id="btnIniciarJogo" disabled>Iniciar Jogo</button>
        </div>

        <div class="fichas-lista" id="fichasLista"></div>
        <p class="fichas-lista-vazia" id="fichasListaVazia" style="display:none;">Nenhuma ficha encontrada.</p>
      </div>

      <!-- MODAL DE CONFIRMACAO DE EXCLUSAO -->
      <div class="fichas-modal-overlay" id="modalOverlay" style="display:none;">
        <div class="fichas-modal">
          <div class="fichas-modal-titulo">Confirmar Exclusao</div>
          <p class="fichas-modal-texto" id="modalTexto">Tem certeza que deseja apagar esta ficha?</p>
          <div class="fichas-modal-botoes">
            <button class="fichas-modal-btn fichas-modal-btn--cancelar" id="modalCancelar">Cancelar</button>
            <button class="fichas-modal-btn fichas-modal-btn--confirmar" id="modalConfirmar">Apagar</button>
          </div>
        </div>
      </div>

      <footer class="fichas-rodape">
        <button class="fichas-voltar" id="btnVoltar">
          <span class="voltar-seta">&#9664;</span>
          <span class="voltar-texto">Retornar ao Grimorio</span>
        </button>
      </footer>

    </div>

  </div>

  <script src="../db.js"></script>
  <script src="fichas.js"></script>
</body>

</html>
