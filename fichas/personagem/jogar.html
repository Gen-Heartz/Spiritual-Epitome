<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#332c24">
  <title>Mesa de Jogo - Grimorio do Mestre</title>
  <link rel="manifest" href="../../manifest.json">
  <link rel="stylesheet" href="../../styles.css">
  <link rel="stylesheet" href="jogar.css">
</head>
<body class="jogar-body">

  <!-- AVISO DE ORIENTACAO (celular em retrato) -->
  <div class="jogar-aviso-orientacao" id="avisoOrientacao">
    <div class="jogar-aviso-caixa">
      <div class="jogar-aviso-icone">&#8635;</div>
      <h2 class="jogar-aviso-titulo">Gire o Dispositivo</h2>
      <p class="jogar-aviso-texto">
        O modo de tela dividida com duas fichas requer <strong>orientacao horizontal</strong>.
        <br><br>
        Gire seu aparelho para a posicao paisagem para continuar.
      </p>
      <button class="jogar-aviso-btn" id="btnVoltarAviso">Voltar as Fichas</button>
    </div>
  </div>

  <!-- BARRA SUPERIOR -->
  <header class="jogar-barra">
    <button class="jogar-barra-btn" id="btnSair">&#9664; Sair</button>
    <div class="jogar-barra-nomes">
      <span class="jogar-barra-nome" id="nomeFicha1">Carregando...</span>
      <span class="jogar-barra-sep">|</span>
      <span class="jogar-barra-nome" id="nomeFicha2">Carregando...</span>
    </div>
    <button class="jogar-barra-btn" id="btnRecarregar" title="Recarregar ambas as fichas">Recarregar</button>
  </header>

  <!-- PAINEIS -->
  <main class="jogar-painel" id="jogarPainel">
    <div class="jogar-coluna" id="coluna1">
      <iframe class="jogar-frame" id="frame1" title="Ficha 1"></iframe>
    </div>
    <div class="jogar-divisor"></div>
    <div class="jogar-coluna" id="coluna2">
      <iframe class="jogar-frame" id="frame2" title="Ficha 2"></iframe>
    </div>
  </main>

  <script src="../../db.js"></script>
  <script src="jogar.js"></script>
</body>
</html>
