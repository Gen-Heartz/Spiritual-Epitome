<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div id="container">
        <div id="caixaVida">
            <label for="Vida">Vida</label>
            <input type="energia" id="vidaTotal" placeholder="Vida Total" title="Vida"
                style="width: 80px; text-align: center;" readonly>
            <input type="energia" id="vidaAtual" placeholder="Vida Atual" title="Vida Atual"
                style="width: 80px; text-align: center;" readonly>
            <input type="energia" id="vidaPerdida" placeholder="Perdida" title="Vida Perdida"
                style="width: 80px; text-align: center;">
            <input type="energia" id="vidaVendida" placeholder="Vendida" title="Vida Vendida"
                style="width: 80px; text-align: center; border: 2px solid #840505; background-color: #1a1a1a; color: #840505; border-radius: 2px;">
            <div style="position: relative; display: inline-block;">
                <button id="descansar" title="Click para descansar"
                    style="width: 80px; text-align: center; border: 2px solid #0f8405; background-color: #1a1a1a; color: #0f8405; border-radius: 2px; margin-left: 5px;">Descansar</button>
                <div id="modalDescansar">
                    <button id="descCurto" title="Recupera Vigor">Curto</button>
                    <button id="descMedio" title="Recupera Vigor x2">Medio</button>
                    <button id="descLongo" title="Recupera Vigor x3">Longo</button>
                    <input type="text" id="descCustom" placeholder="Valor" title="Digite o valor e pressione Enter">
                </div>
            </div>
        </div>
        <div id="caixaMana">
            <label for="Mana">Mana</label>
            <input type="energia" id="manaTotal" placeholder="Mana Total" title="Mana"
                style="width: 80px; text-align: center;">
            <input type="energia" id="manaAtual" placeholder="Mana Atual" title="Mana Atual"
                style="width: 80px; text-align: center;">
            <input type="energia" id="manaVendida" placeholder="Vendida" title="Mana Vendida"
                style="width: 80px; text-align: center; border: 2px solid #050584; background-color: #1a1a1a; color: #050584; border-radius: 2px;">
            <button id="meditar" title="Click para meditar"
                style="width: 80px; text-align: center; border: 2px solid #050584; background-color: #1a1a1a; color: #f8f8f8; border-radius: 2px; margin-left: 5px;">Interno</button>
            <button id="meditar2" title="Click para meditar"
                style="width: 80px; text-align: center; border: 2px solid #050584; background-color: #1a1a1a; color: #f8f8f8; border-radius: 2px; margin-left: 5px;">Externo</button>
        </div>
        <div id="caixaEstamina">
            <label for="Estamina">Estamina</label>
            <input type="energia" id="estaminaTotal" placeholder="Est Total" title="Estamina"
                style="width: 80px; text-align: center;">
            <input type="energia" id="estaminaAtual" placeholder="Est Atual" title="Estamina Atual"
                style="width: 80px; text-align: center;">
            <input type="energia" id="estaminaGasto" placeholder="Gasto" title="Estamina Gasto"
                style="width: 80px; text-align: center;">
            <button id="descansarEstamina" title="Click para Recuperar Estamina"
                style="width: 80px; text-align: center; border: 2px solid #0f8405; background-color: #1a1a1a; color: #0f8405; border-radius: 2px; margin-left: 5px;">Recuperar</button>
        </div>
        <div id="caixaMental">
            <label for="Mental">Raciocinio</label>
            <input type="energia" id="mentalTotal" placeholder="Rac Total" title="Raciocinio"
                style="width: 80px; text-align: center;">
            <input type="energia" id="mentalAtual" placeholder="Rac Atual" title="Raciocinio Atual"
                style="width: 80px; text-align: center;">
            <input type="energia" id="mentalGasto" placeholder="Gasto" title="Raciocinio Gasto"
                style="width: 80px; text-align: center;">
        </div>
    </div>

    <div id="containerPericias">
        <div class="pericia-linha">
            <label>Fisico</label>
            <input type="text" id="atletismo" placeholder="Atletismo" title="Atletismo" style="width: 90px; text-align: center;">
            <input type="text" id="vigor" placeholder="Vigor" title="Vigor" style="width: 90px; text-align: center;">
            <input type="text" id="tolerancia" placeholder="Tolerancia" title="Tolerancia" style="width: 90px; text-align: center;">
        </div>
        <div class="pericia-linha">
            <label>Espiritual</label>
            <input type="text" id="canalizacao" placeholder="Canalizacao" title="Canalizacao" style="width: 90px; text-align: center;">
            <input type="text" id="integracao" placeholder="Integracao" title="Integracao" style="width: 90px; text-align: center;">
            <input type="text" id="ancoragem" placeholder="Ancoragem" title="Ancoragem" style="width: 90px; text-align: center;">
        </div>
        <div class="pericia-linha">
            <label>Mental</label>
            <input type="text" id="analise" placeholder="Analise" title="Analise" style="width: 90px; text-align: center;">
            <input type="text" id="foco" placeholder="Foco" title="Foco" style="width: 90px; text-align: center;">
            <input type="text" id="concentracao" placeholder="Concentracao" title="Concentracao" style="width: 90px; text-align: center;">
        </div>
        <div class="pericia-linha">
            <label>Sentidos</label>
            <input type="text" id="prontidao" placeholder="Prontidao" title="Prontidao" style="width: 90px; text-align: center;">
            <input type="text" id="investigacao" placeholder="Investigacao" title="Investigacao" style="width: 90px; text-align: center;">
            <input type="text" id="sensibilidade" placeholder="Sensibilidade" title="Sensibilidade" style="width: 90px; text-align: center;">
        </div>
        <div class="pericia-linha">
            <label>Social</label>
            <input type="text" id="sensacao" placeholder="Sensacao" title="Sensacao" style="width: 90px; text-align: center;">
            <input type="text" id="persuasao" placeholder="Persuasao" title="Persuasao" style="width: 90px; text-align: center;">
            <input type="text" id="empatia" placeholder="Empatia" title="Empatia" style="width: 90px; text-align: center;">
        </div>
        <div class="pericia-linha">
            <label>Combate</label>
            <input type="text" id="agilidade" placeholder="Agilidade" title="Agilidade" style="width: 90px; text-align: center;">
            <input type="text" id="forca" placeholder="Forca" title="Forca" style="width: 90px; text-align: center;">
            <input type="text" id="manualidade" placeholder="Manualidade" title="Manualidade" style="width: 90px; text-align: center;">
        </div>
    </div>
</body>
<style>
    body {
        background-color: #1a1a1a;
        color: #fff;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
    }

    input[type="energia"] {
        margin: 0 0 0 5px;
    }

    input[readonly] {
        opacity: 0.7;
        cursor: default;
    }

    label {
        display: inline-block;
        width: 80px;
        text-align: right;
    }

    #container {
        display: flex;
        justify-content: center;
        flex-direction: column;
        align-items: flex-start;
        padding: 20px;
    }

    #caixaVida,
    #caixaMana,
    #caixaMental,
    #caixaEstamina {
        display: flex;
        align-items: center;
        margin-bottom: 10px;
    }

    #containerPericias {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        padding: 0 20px 20px 20px;
    }

    .pericia-linha {
        display: flex;
        align-items: center;
        margin-bottom: 10px;
    }

    .pericia-linha input {
        margin: 0 0 0 5px;
    }

    #modalDescansar {
        display: none;
        position: absolute;
        top: 100%;
        left: 5px;
        margin-top: 4px;
        background-color: #2a2a2a;
        border: 1px solid #444;
        padding: 8px;
        z-index: 10;
        flex-direction: column;
        gap: 4px;
        width: 120px;
    }

    #modalDescansar.aberto {
        display: flex;
    }

    #modalDescansar button {
        width: 100%;
        padding: 4px 0;
        border: 1px solid #0f8405;
        background-color: #1a1a1a;
        color: #0f8405;
        border-radius: 2px;
        cursor: pointer;
        font-size: 13px;
    }

    #modalDescansar button:hover {
        background-color: #0f8405;
        color: #1a1a1a;
    }

    #modalDescansar input {
        width: 100%;
        padding: 4px 0;
        border: 1px solid #555;
        background-color: #1a1a1a;
        color: #fff;
        border-radius: 2px;
        text-align: center;
        font-size: 13px;
        box-sizing: border-box;
    }
</style>

<script>
    const el = id => document.getElementById(id);

    let vidaAtualValor = 0;
    let vidaVendidaTotal = 0;

    function getNum(id) {
        return parseFloat(el(id).value) || 0;
    }

    function calcVidaTotal() {
        const vigor = getNum('vigor');
        const total = 10 + (vigor * 3);
        el('vidaTotal').value = total;
        return total;
    }

    function calcVidaAtual() {
        const total = calcVidaTotal();
        const max = total - vidaVendidaTotal;
        if (vidaAtualValor > max) vidaAtualValor = max;
        if (vidaAtualValor < 0) vidaAtualValor = 0;
        el('vidaAtual').value = vidaAtualValor;
    }

    function inicializarVida() {
        const total = calcVidaTotal();
        vidaAtualValor = total - vidaVendidaTotal;
        calcVidaAtual();
    }

    // Vigor muda -> recalcula vida total e atual
    el('vigor').addEventListener('input', function () {
        inicializarVida();
    });

    // Vida Vendida: ao pressionar Enter, acumula permanentemente e limpa o campo
    el('vidaVendida').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
            const valor = parseFloat(this.value) || 0;
            const total = calcVidaTotal();
            const limiteVendida = total - 1;
            if (vidaVendidaTotal + valor > limiteVendida) {
                vidaVendidaTotal = limiteVendida;
            } else {
                vidaVendidaTotal += valor;
            }
            const max = total - vidaVendidaTotal;
            vidaAtualValor = Math.min(vidaAtualValor, max);
            if (vidaAtualValor < 0) vidaAtualValor = 0;
            el('vidaAtual').value = vidaAtualValor;
            this.value = '';
            this.title = 'Vida Vendida: ' + vidaVendidaTotal;
        }
    });

    // Vida Perdida: ao pressionar Enter, subtrai da vida atual e limpa o campo
    el('vidaPerdida').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
            const dano = parseFloat(this.value) || 0;
            vidaAtualValor -= dano;
            const total = calcVidaTotal();
            const max = total - vidaVendidaTotal;
            if (vidaAtualValor > max) vidaAtualValor = max;
            if (vidaAtualValor < 0) vidaAtualValor = 0;
            el('vidaAtual').value = vidaAtualValor;
            this.value = '';
        }
    });

    // Recuperar vida (usado pelo modal)
    function recuperarVida(valor) {
        const total = calcVidaTotal();
        const max = total - vidaVendidaTotal;
        vidaAtualValor += valor;
        if (vidaAtualValor > max) vidaAtualValor = max;
        if (vidaAtualValor < 0) vidaAtualValor = 0;
        el('vidaAtual').value = vidaAtualValor;
    }

    // Modal Descansar
    const modal = el('modalDescansar');

    el('descansar').addEventListener('click', function (e) {
        e.stopPropagation();
        modal.classList.toggle('aberto');
    });

    // Fechar modal ao clicar fora
    document.addEventListener('click', function (e) {
        if (!modal.contains(e.target) && e.target !== el('descansar')) {
            modal.classList.remove('aberto');
        }
    });

    // Curto: recupera Vigor
    el('descCurto').addEventListener('click', function () {
        const vigor = getNum('vigor');
        recuperarVida(vigor);
        modal.classList.remove('aberto');
    });

    // Medio: recupera Vigor * 2
    el('descMedio').addEventListener('click', function () {
        const vigor = getNum('vigor');
        recuperarVida(vigor * 2);
        modal.classList.remove('aberto');
    });

    // Longo: recupera Vigor * 3
    el('descLongo').addEventListener('click', function () {
        const vigor = getNum('vigor');
        recuperarVida(vigor * 4);
        modal.classList.remove('aberto');
    });

    // Input custom: Enter para recuperar valor digitado
    el('descCustom').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
            const valor = parseFloat(this.value) || 0;
            recuperarVida(valor);
            this.value = '';
            modal.classList.remove('aberto');
        }
    });

    // Impedir que cliques dentro do modal fechem ele
    modal.addEventListener('click', function (e) {
        e.stopPropagation();
    });

    // Inicializar
    inicializarVida();
</script>

</html>
